<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bảng điều khiển - Quản lý Công việc</title>
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="app-sidebar"></aside>
    <div class="main-wrapper">
      <header class="topbar" id="app-topbar"></header>
      <main class="content-container">
        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-label">Tổng số Nhiệm vụ</div>
            <div class="stat-value" id="stat-total-tasks">--</div>
          </div>
          <div class="stat-card" style="border-left-color: #2563eb;">
            <div class="stat-label">Đang thực hiện</div>
            <div class="stat-value" id="stat-inprogress-tasks">--</div>
          </div>
          <div class="stat-card" style="border-left-color: #15803d;">
            <div class="stat-label">Đã hoàn thành</div>
            <div class="stat-value" id="stat-completed-tasks">--</div>
          </div>
          <div class="stat-card" style="border-left-color: #b91c1c;">
            <div class="stat-label">Nhiệm vụ Quá hạn</div>
            <div class="stat-value" id="stat-overdue-tasks" style="color: var(--danger);">--</div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-title">Điều hành Nhanh & Quản lý Nhiệm vụ</div>
          </div>
          <p style="margin-bottom: 14px; color: var(--slate-700);">
            Xin chào <strong id="welcome-name"></strong>! Bạn đang đăng nhập với quyền <span id="welcome-role" class="role-badge"></span>.
          </p>
          <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <a href="./pages/task-create.html" class="btn btn-primary">+ Tạo Công việc / Giao Nhiệm vụ Mới</a>
            <a href="./pages/tasks.html" class="btn btn-outline">📋 Xem Danh sách Nhiệm vụ</a>
            <a href="./pages/profile.html" class="btn btn-outline">👤 Hồ sơ & Liên kết Zalo Bot</a>
            <a href="./pages/users.html" id="btn-goto-users" class="btn btn-outline">👥 Quản lý Cán bộ & Đơn vị</a>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="./assets/js/api.js"></script>
  <script src="./assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await App.initProtectedPage('dashboard', 'Bảng điều khiển trung tâm');
      if (!user) return;

      document.getElementById('welcome-name').textContent = user.Full_Name;
      const roleEl = document.getElementById('welcome-role');
      roleEl.textContent = user.Role;
      roleEl.className = 'role-badge role-' + user.Role;

      if (user.Role === 'USER') {
        document.getElementById('btn-goto-users').style.display = 'none';
      }

      const taskRes = await ApiClient.call('tasks.list', {});
      if (taskRes.success && taskRes.data.summary) {
        const s = taskRes.data.summary;
        document.getElementById('stat-total-tasks').textContent = s.total || 0;
        document.getElementById('stat-inprogress-tasks').textContent = (s.pending || 0) + (s.inProgress || 0) + (s.waitingConfirm || 0);
        document.getElementById('stat-completed-tasks').textContent = s.completed || 0;
        document.getElementById('stat-overdue-tasks').textContent = s.overdue || 0;
      }
    });
  </script>
</body>
</html>
