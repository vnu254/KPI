<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hồ sơ cá nhân & Liên kết Zalo Bot</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="app-sidebar"></aside>
    <div class="main-wrapper">
      <header class="topbar" id="app-topbar"></header>
      <main class="content-container">
        <div class="form-grid" style="grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));">

          <!-- KHỐI 1: THÔNG TIN CÁ NHÂN & CẤU HÌNH NHẮC VIỆC -->
          <div class="card">
            <div class="card-header">
              <div class="card-title">1. Thông tin Cá nhân & Cấu hình Nhắc việc</div>
            </div>
            <form id="form-profile">
              <div class="form-group">
                <label class="form-label">Mã cán bộ / Email đăng nhập</label>
                <input type="text" id="prof-email" class="form-control" disabled>
              </div>
              <div class="form-group">
                <label class="form-label">Họ và tên</label>
                <input type="text" id="prof-fullname" class="form-control" required>
              </div>
              <div class="form-grid">
                <div class="form-group">
                  <label class="form-label">Chức vụ</label>
                  <input type="text" id="prof-position" class="form-control">
                </div>
                <div class="form-group">
                  <label class="form-label">Số điện thoại</label>
                  <input type="text" id="prof-phone" class="form-control">
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Mốc nhắc việc trước hạn (phút, cách nhau dấu phẩy)</label>
                <input type="text" id="prof-remind" class="form-control" placeholder="1440, 120, 30">
                <small style="color: var(--slate-500);">Ví dụ: 1440 (1 ngày), 120 (2 giờ), 30 (30 phút)</small>
              </div>
              <button type="submit" class="btn btn-primary">💾 Lưu Thông tin Cá nhân</button>
            </form>
          </div>

          <!-- KHỐI 2: LIÊN KẾT TRỰC TIẾP ZALO BOT (KHÔNG DÙNG WEBHOOK) -->
          <div class="card">
            <div class="card-header">
              <div class="card-title">2. Liên kết Nhận thông báo Zalo Bot Trực tiếp</div>
            </div>
            <div class="form-group">
              <label class="form-label">Cách 1: Nhập trực tiếp mã Zalo Chat ID của bạn</label>
              <div style="display: flex; gap: 8px;">
                <input type="text" id="prof-zalo-chatid" class="form-control" placeholder="Ví dụ: 3fded422ae7e47201e6f">
                <button type="button" id="btn-save-chatid" class="btn btn-primary" style="white-space: nowrap;">Lưu & Xác nhận</button>
              </div>
            </div>

            <div class="form-group" style="margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--slate-300);">
              <label class="form-label">Cách 2: Tự động dò Chat ID bằng Mã liên kết (Không cần biết trước ID)</label>
              <p style="font-size: 12px; color: var(--slate-500); margin-bottom: 8px;">
                Bấm nút tạo mã, gửi mã <strong>LK_xxxxxx</strong> vào Zalo Bot trên điện thoại, sau đó bấm "Kiểm tra & Liên kết".
              </p>
              <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                <button type="button" id="btn-gen-code" class="btn btn-outline btn-sm">Tạo mã liên kết</button>
                <input type="text" id="input-link-code" class="form-control" style="max-width: 150px; font-weight: 700;" placeholder="LK_xxxxxx">
                <button type="button" id="btn-verify-code" class="btn btn-primary btn-sm">Kiểm tra & Liên kết</button>
              </div>
            </div>

            <div style="margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--slate-200);">
              <button type="button" id="btn-test-zalo" class="btn btn-outline" style="width: 100%;">
                🚀 Gửi tin nhắn kiểm thử tới Zalo của tôi (Test Bot)
              </button>
            </div>
          </div>

          <!-- KHỐI 3: ĐỔI MẬT KHẨU -->
          <div class="card">
            <div class="card-header">
              <div class="card-title">3. Đổi Mật khẩu Bảo mật</div>
            </div>
            <form id="form-change-pwd">
              <div class="form-group">
                <label class="form-label">Mật khẩu hiện tại</label>
                <input type="password" id="pwd-old" class="form-control" required>
              </div>
              <div class="form-group">
                <label class="form-label">Mật khẩu mới (Tối thiểu 6 ký tự)</label>
                <input type="password" id="pwd-new" class="form-control" required>
              </div>
              <button type="submit" class="btn btn-primary">🔐 Cập nhật Mật khẩu Mới</button>
            </form>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await App.initProtectedPage('profile', 'Thông tin Cá nhân & Liên kết Zalo Bot');
      if (!user) return;

      document.getElementById('prof-email').value = `${user.User_ID} | ${user.Email}`;
      document.getElementById('prof-fullname').value = user.Full_Name || '';
      document.getElementById('prof-position').value = user.Position || '';
      document.getElementById('prof-phone').value = user.Phone || '';
      document.getElementById('prof-zalo-chatid').value = user.Zalo_Chat_ID || '';
      const mins = (user.Notify_Preferences && user.Notify_Preferences.remindBeforeMins) || [1440, 120, 30];
      document.getElementById('prof-remind').value = mins.join(', ');

      // Lưu hồ sơ cá nhân
      document.getElementById('form-profile').addEventListener('submit', async (e) => {
        e.preventDefault();
        const remindArr = document.getElementById('prof-remind').value
          .split(',')
          .map(x => parseInt(x.trim(), 10))
          .filter(x => !isNaN(x) && x > 0);

        const res = await ApiClient.call('profile.update', {
          fullName: document.getElementById('prof-fullname').value.trim(),
          position: document.getElementById('prof-position').value.trim(),
          phone: document.getElementById('prof-phone').value.trim(),
          zaloChatId: document.getElementById('prof-zalo-chatid').value.trim(),
          notifyPreferences: {
            zalo: true,
            email: true,
            remindBeforeMins: remindArr.length ? remindArr : [1440, 120, 30]
          }
        });
        App.toast(res.message, res.success ? 'success' : 'error');
      });

      // Lưu trực tiếp Zalo Chat ID & Gửi tin xác nhận
      document.getElementById('btn-save-chatid').addEventListener('click', async () => {
        const chatId = document.getElementById('prof-zalo-chatid').value.trim();
        if (!chatId) {
          App.toast('Vui lòng nhập mã Zalo Chat ID.', 'error');
          return;
        }
        const res = await ApiClient.call('zalo.linkDirectChatId', {
          targetType: 'USER',
          targetId: user.User_ID,
          chatId: chatId
        });
        App.toast(res.message, res.success ? 'success' : 'error');
      });

      // Tạo mã LK_xxxxxx
      document.getElementById('btn-gen-code').addEventListener('click', async () => {
        const res = await ApiClient.call('profile.generateZaloCode');
        if (res.success) {
          document.getElementById('input-link-code').value = res.data.linkCode;
          App.toast(`Hãy nhắn mã ${res.data.linkCode} vào Zalo Bot rồi bấm Kiểm tra!`);
        }
      });

      // Đối chiếu mã LK_xxxxxx bằng getUpdates (Không dùng Webhook)
      document.getElementById('btn-verify-code').addEventListener('click', async () => {
        const code = document.getElementById('input-link-code').value.trim();
        if (!code) {
          App.toast('Vui lòng tạo hoặc nhập mã LK_xxxxxx trước.', 'error');
          return;
        }
        const res = await ApiClient.call('zalo.verifyLinkByPolling', { linkCode: code });
        if (res.success && res.data && res.data.chatId) {
          document.getElementById('prof-zalo-chatid').value = res.data.chatId;
          App.toast('Đã tìm thấy Chat ID: ' + res.data.chatId + ' và liên kết thành công!');
        } else {
          App.toast(res.message || 'Chưa tìm thấy tin nhắn chứa mã này.', 'error');
        }
      });

      // Test gửi tin nhắn Zalo Bot trực tiếp
      document.getElementById('btn-test-zalo').addEventListener('click', async () => {
        const chatId = document.getElementById('prof-zalo-chatid').value.trim();
        const res = await ApiClient.call('zalo.testDirectSend', { chatId: chatId });
        App.toast(res.message, res.success ? 'success' : 'error');
      });

      // Đổi mật khẩu
      document.getElementById('form-change-pwd').addEventListener('submit', async (e) => {
        e.preventDefault();
        const oldPassword = document.getElementById('pwd-old').value;
        const newPassword = document.getElementById('pwd-new').value;
        const res = await ApiClient.call('auth.changePassword', { oldPassword, newPassword });
        if (res.success) {
          const sess = ApiClient.getSession();
          sess.token = res.data.token;
          ApiClient.saveSession(sess);
          document.getElementById('form-change-pwd').reset();
          App.toast('Đổi mật khẩu thành công!');
        } else {
          App.toast(res.message, 'error');
        }
      });
    });
  </script>
</body>
</html>
